<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQLite in de browser</title>
<script>try { const t = localStorage.getItem('theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #6b7280;
    --border: #d9dde4; --accent: #2563eb; --accent-text: #ffffff;
    --ok: #15803d; --err: #b91c1c; --code-bg: #fbfbfc; --row-alt: #f3f5f8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14171c; --panel: #1c2027; --text: #e6e8ec; --muted: #9aa3af;
      --border: #333a45; --accent: #3b82f6; --accent-text: #ffffff;
      --ok: #4ade80; --err: #f87171; --code-bg: #181b21; --row-alt: #20252d;
    }
  }
  :root[data-theme="dark"] {
      --bg: #14171c; --panel: #1c2027; --text: #e6e8ec; --muted: #9aa3af;
      --border: #333a45; --accent: #3b82f6; --accent-text: #ffffff;
      --ok: #4ade80; --err: #f87171; --code-bg: #181b21; --row-alt: #20252d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
           display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  header h1 { font-size: 18px; margin: 0 16px 0 0; }
  button, .filebtn { font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 6px;
           border: 1px solid var(--border); background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover, .filebtn:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .filebtn input { display: none; }
  label.check { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  main { display: grid; grid-template-columns: 220px 1fr; gap: 16px; padding: 16px; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } }
  aside, section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; min-width: 0; }
  aside h2, section h2 { font-size: 14px; margin: 0 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  #tables { list-style: none; margin: 0; padding: 0; }
  #tables li { padding: 4px 6px; border-radius: 4px; cursor: pointer; font-family: ui-monospace, monospace; font-size: 13px; }
  #tables li:hover { background: var(--row-alt); }
  #tables .empty { color: var(--muted); cursor: default; font-family: inherit; }
  textarea { width: 100%; min-height: 160px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace;
             font-size: 14px; padding: 10px; border: 1px solid var(--border); border-radius: 6px;
             background: var(--code-bg); color: var(--text); }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  .hint { color: var(--muted); font-size: 13px; }
  #status { font-size: 13px; color: var(--muted); margin-left: auto; }
  #results { margin-top: 16px; }
  .result { margin-bottom: 16px; }
  .sql { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted);
         white-space: pre-wrap; word-break: break-word; margin-bottom: 4px; }
  .msg.ok { color: var(--ok); } .msg.err { color: var(--err); }
  .tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { background: var(--row-alt); position: sticky; top: 0; }
  tr:nth-child(even) td { background: var(--row-alt); }
  td.null { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>SQLite in de browser</h1>
  <button id="btnNew">Nieuwe database</button>
  <label class="filebtn">Open .sqlite<input type="file" id="fileDb" accept=".sqlite,.sqlite3,.db"></label>
  <label class="filebtn">Importeer .sql<input type="file" id="fileSql" accept=".sql,.txt"></label>
  <button id="btnDownload">Download .sqlite</button>
  <button id="btnExportSql">Exporteer .sql</button>
  <button id="btnSave">Bewaar in browser</button>
  <label class="check"><input type="checkbox" id="autoSave"> automatisch bewaren</label>
  <button id="btnTheme" title="Wissel tussen donker en licht"></button>
  <span id="status">Laden…</span>
</header>

<main>
  <aside>
    <h2>Tabellen</h2>
    <ul id="tables"></ul>
  </aside>
  <section>
    <h2>SQL</h2>
    <textarea id="sql" spellcheck="false" placeholder="Typ hier je SQL, bijv. SELECT * FROM leerlingen;"></textarea>
    <div class="row">
      <button class="primary" id="btnRun">Uitvoeren</button>
      <button id="btnClear">Resultaten wissen</button>
      <span class="hint">Ctrl/Cmd + Enter voert uit. Meerdere commando's scheiden met ;</span>
    </div>
    <div id="results"></div>
  </section>
</main>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
$(function () {
  const IDB_NAME = 'sqlite-web', IDB_STORE = 'files', IDB_KEY = 'current';
  let SQL, db;

  // ---------- IndexedDB (browseropslag) ----------
  function idb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  async function idbGet(key) {
    const d = await idb();
    return new Promise((resolve, reject) => {
      const r = d.transaction(IDB_STORE).objectStore(IDB_STORE).get(key);
      r.onsuccess = () => resolve(r.result); r.onerror = () => reject(r.error);
    });
  }
  async function idbPut(key, val) {
    const d = await idb();
    return new Promise((resolve, reject) => {
      const tx = d.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(val, key);
      tx.oncomplete = resolve; tx.onerror = () => reject(tx.error);
    });
  }

  function status(t) { $('#status').text(t); }
  function getPref(k, def) { try { const v = localStorage.getItem(k); return v === null ? def : v; } catch (e) { return def; } }
  function setPref(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  async function saveToBrowser(silent) {
    try {
      await idbPut(IDB_KEY, db.export());
      status('Bewaard in browser om ' + new Date().toLocaleTimeString());
    } catch (e) { if (!silent) alert('Bewaren mislukt: ' + e.message); }
  }
  function changed() { if ($('#autoSave').prop('checked')) saveToBrowser(true); refreshTables(); }

  function openDb(bytes, label) {
    if (db) db.close();
    db = bytes ? new SQL.Database(bytes) : new SQL.Database();
    db.exec('PRAGMA foreign_keys = ON;');
    refreshTables();
    status(label);
  }

  // ---------- Tabellenlijst ----------
  function refreshTables() {
    const $ul = $('#tables').empty();
    const res = db.exec("SELECT name, type FROM sqlite_master WHERE type IN ('table','view') AND name NOT LIKE 'sqlite_%' ORDER BY name");
    if (!res.length) { $ul.append('<li class="empty">Nog geen tabellen</li>'); return; }
    res[0].values.forEach(([name, type]) => {
      $('<li>').text(name + (type === 'view' ? ' (view)' : '')).attr('title', 'Klik voor SELECT *')
        .on('click', () => {
          $('#sql').val('SELECT * FROM "' + name.replace(/"/g, '""') + '" LIMIT 100;');
          run();
        }).appendTo($ul);
    });
  }

  // ---------- Resultaten tonen ----------
  function renderTable(columns, rows) {
    const $t = $('<table>'), $tr = $('<tr>');
    columns.forEach(c => $('<th>').text(c).appendTo($tr));
    $('<thead>').append($tr).appendTo($t);
    const $tb = $('<tbody>').appendTo($t);
    rows.forEach(r => {
      const $row = $('<tr>');
      r.forEach(v => {
        const $td = $('<td>');
        if (v === null) $td.addClass('null').text('NULL');
        else if (v instanceof Uint8Array) $td.text('[BLOB ' + v.length + ' bytes]');
        else $td.text(v);
        $row.append($td);
      });
      $tb.append($row);
    });
    return $('<div class="tablewrap">').append($t);
  }

  function addResult(sqlText, $body) {
    const $r = $('<div class="result">');
    if (sqlText) $('<div class="sql">').text(sqlText).appendTo($r);
    $r.append($body);
    $('#results').append($r);
  }

  // Voert elk commando apart uit, zodat je per commando het resultaat ziet
  function run() {
    const text = $('#sql').val();
    if (!text.trim()) return;
    $('#results').empty();
    let didChange = false;
    try {
      for (const stmt of db.iterateStatements(text)) {
        const sqlText = stmt.getSQL().trim();
        const cols = stmt.getColumnNames();
        const rows = [];
        try {
          while (stmt.step()) rows.push(stmt.get());
        } finally { stmt.free(); }
        if (cols.length) {
          addResult(sqlText, rows.length
            ? renderTable(cols, rows).add($('<div class="hint">').text(rows.length + ' rij(en)'))
            : $('<div class="msg ok">').text('Geen rijen gevonden.'));
        } else {
          const n = db.getRowsModified();
          const isDml = /^\s*(insert|update|delete|replace)/i.test(sqlText);
          addResult(sqlText, $('<div class="msg ok">').text(isDml ? n + ' rij(en) gewijzigd.' : 'Uitgevoerd.'));
          didChange = true;
        }
      }
    } catch (e) {
      addResult(null, $('<div class="msg err">').text('Fout: ' + e.message));
    }
    if (didChange) changed();
  }

  // ---------- Bestanden ----------
  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  function sqlLiteral(v) {
    if (v === null) return 'NULL';
    if (typeof v === 'number') return String(v);
    if (v instanceof Uint8Array) return "X'" + Array.from(v, b => b.toString(16).padStart(2, '0')).join('') + "'";
    return "'" + String(v).replace(/'/g, "''") + "'";
  }

  function exportSql() {
    let out = 'PRAGMA foreign_keys=OFF;\nBEGIN TRANSACTION;\n';
    const objs = db.exec("SELECT type, name, sql FROM sqlite_master WHERE sql NOT NULL AND name NOT LIKE 'sqlite_%' ORDER BY CASE type WHEN 'table' THEN 0 ELSE 1 END, name");
    if (objs.length) {
      objs[0].values.forEach(([type, name, sql]) => {
        if (type !== 'table') return;
        out += sql + ';\n';
        const data = db.exec('SELECT * FROM "' + name.replace(/"/g, '""') + '"');
        if (data.length) data[0].values.forEach(r => {
          out += 'INSERT INTO "' + name.replace(/"/g, '""') + '" VALUES(' + r.map(sqlLiteral).join(',') + ');\n';
        });
      });
      objs[0].values.forEach(([type, , sql]) => { if (type !== 'table') out += sql + ';\n'; });
    }
    return out + 'COMMIT;\n';
  }

  $('#btnNew').on('click', () => {
    if (!confirm('Nieuwe, lege database starten? Niet-bewaarde wijzigingen gaan verloren.')) return;
    openDb(null, 'Nieuwe lege database');
    $('#results').empty();
    if ($('#autoSave').prop('checked')) saveToBrowser(true);
  });

  $('#fileDb').on('change', function () {
    const f = this.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        openDb(new Uint8Array(reader.result), 'Geopend: ' + f.name);
        db.exec('SELECT count(*) FROM sqlite_master'); // controle of het een geldige database is
        $('#results').empty();
        if ($('#autoSave').prop('checked')) saveToBrowser(true);
      } catch (e) {
        alert('Dit is geen geldig SQLite-bestand: ' + e.message);
        openDb(null, 'Nieuwe lege database');
      }
    };
    reader.readAsArrayBuffer(f);
    this.value = '';
  });

  $('#fileSql').on('change', function () {
    const f = this.files[0]; if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      $('#sql').val(reader.result);
      run();
      status('Geïmporteerd: ' + f.name);
    };
    reader.readAsText(f);
    this.value = '';
  });

  $('#btnDownload').on('click', () => download(new Blob([db.export()], { type: 'application/x-sqlite3' }), 'database.sqlite'));
  $('#btnExportSql').on('click', () => download(new Blob([exportSql()], { type: 'text/plain' }), 'database.sql'));
  $('#btnSave').on('click', () => saveToBrowser(false));
  $('#autoSave').on('change', function () {
    setPref('autoSave', this.checked ? '1' : '0');
    if (this.checked) saveToBrowser(true);
  });
  $('#btnRun').on('click', run);
  $('#btnClear').on('click', () => $('#results').empty());
  $('#sql').on('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } });

  // ---------- Donker/licht ----------
  function isDark() {
    const t = document.documentElement.getAttribute('data-theme');
    return t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function applyTheme(t) {
    if (t) document.documentElement.setAttribute('data-theme', t);
    $('#btnTheme').text(isDark() ? '☀️ Licht' : '🌙 Donker');
  }
  $('#btnTheme').on('click', () => {
    const t = isDark() ? 'light' : 'dark';
    setPref('theme', t);
    applyTheme(t);
  });
  applyTheme(getPref('theme', null));

  // ---------- Opstarten ----------
  $('#autoSave').prop('checked', getPref('autoSave', '1') === '1');
  initSqlJs({ locateFile: f => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/' + f })
    .then(async S => {
      SQL = S;
      let saved = null;
      try { saved = await idbGet(IDB_KEY); } catch (e) {}
      if (saved) openDb(saved, 'Database uit browser geladen');
      else {
        openDb(null, 'Nieuwe lege database');
        $('#sql').val(
"CREATE TABLE leerlingen (\n  id INTEGER PRIMARY KEY AUTOINCREMENT,\n  naam TEXT NOT NULL,\n  klas TEXT\n);\n" +
"INSERT INTO leerlingen (naam, klas) VALUES ('An', '5A'), ('Bram', '5B'), ('Chloé', '5A');\n" +
"SELECT * FROM leerlingen;");
      }
    })
    .catch(e => status('SQLite kon niet geladen worden: ' + e.message));
});
</script>
</body>
</html>
